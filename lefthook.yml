pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    - name: eslint
      glob: "*.{js,jsx,ts,tsx,astro}"
      run: pnpm exec eslint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
